[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-repo-miner"
version = "0.1.0"
description = "Mine GitHub repositories for LLM-assisted development signals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests",
  "pandas",
  "tqdm",
]

[project.scripts]
github-repo-miner = "github_repo_miner.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
